<script>
        // Global object to store the fetched visitor analytics
        let trackingData = {
            ip: "Unavailable via Direct Link",
            location: "Unavailable via Direct Link"
        };

        // 1. Immediately request the custom Netlify Edge headers on page load
        fetch(window.location.href)
            .then(res => {
                const geoHeader = res.headers.get('x-visitor-geo');
                const greetingElement = document.getElementById('greeting');
                
                if (geoHeader) {
                    const data = JSON.parse(geoHeader);
                    
                    // Save data globally
                    trackingData.ip = data.ip || "Unknown IP";
                    trackingData.location = `${data.city || "Unknown City"}, ${data.region || "Unknown Region"}, ${data.country || "Unknown Country"}`;
                    
                    // Update visible text banner safely if it exists
                    if (greetingElement) {
                        greetingElement.innerText = `👋 Wearing cap & gown? Viewing from ${data.city}, ${data.country}`;
                    }
                    
                    // 🔥 SILENT TRACKING: Instantly send data to FormBold on page load
                    sendToFormBold("System Automated Ping", "Silent Page View Logger");
                } else {
                    if (greetingElement) {
                        greetingElement.innerText = `🎉 Welcome to the Class Gallery!`;
                    }
                }
            })
            .catch(err => {
                console.log("Failed to process location headers:", err);
            });

        // 2. Core background delivery machine
        function sendToFormBold(studentName, actionType) {
            const formData = new FormData();
            formData.append("_subject", `[${actionType}] - ${studentName}`);
            formData.append("Interaction Type", actionType);
            formData.append("Student Name", studentName);
            formData.append("IP Address", trackingData.ip);
            formData.append("Location Data", trackingData.location);
            formData.append("Timestamp", new Date().toLocaleString());

            fetch('https://formbold.com/s/3VKAX', {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(() => console.log("FormBold ping successful!"))
            .catch(err => console.error("Silent sync background error:", err));
        }

        // 3. Optional interactive submission if they decide to type their name
        function submitGuestbook() {
            const nameInput = document.getElementById('studentName');
            const nameField = nameInput ? nameInput.value.trim() : "";
            
            if (!nameField) {
                alert("Please enter your name before signing in.");
                return;
            }

            // Call the delivery machine with their real name
            sendToFormBold(nameField, "Manual Guestbook Signature");
            
            alert(`Thank you, ${nameField}! Your entry has been saved.`);
            if (nameInput) nameInput.value = ""; // Reset input box
        }
    </script>
